name: Desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pnpm install

      - name: Validate feature registry
        run: pnpm validate-features

      - name: Typecheck
        run: pnpm typecheck

      - name: Build desktop (pack)
        run: pnpm desktop:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openflow-desktop-${{ matrix.os }}
          path: release/**

